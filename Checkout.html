<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>IGgrowth | Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/BannerMaker_28022023_2111111.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="Header site-header">
      <a href="index.html">
      <img src="images/BannerMaker_27022023_205920.png" height="55" style="position: relative; justify-content: center;" alt="IGgrowth home">
      </a>
      <a href="index.html">
      <button id="back">&lt;Back</button>
      </a>
    </header>
    <div style="position: absolute; background-color: #F3F6FD; width: 100%; height: 100%;"></div>
    <div class="center-row">
      <div id="checkout-box">
        <div style="position: absolute; display: flex; flex-direction: column; align-items: center;">
          <h3 id="text-amount">100 Instagram Followers</h3>
          <div id="dividing-line"></div>
          <input type="text" id="usernameInput" aria-label="Instagram username" autocomplete="username" placeholder="Instagram username">
          <input type="text" id="emailInput" aria-label="Email address" autocomplete="email" placeholder="Email address">
          <button id="submitBtn">Continue</button>
          <div id="paypal-button-container" class="paypal-button-container"></div>
          <span id="errorText" role="alert"></span>
          <div id="loadingText" style="font-weight: bold;"></div>
          <div class="center-row">
          <a id="sd" href="Buy Instagram Followers.html">
            <button id="select-different">Pick a different package</button>
          </a>
          </div>
        </div>
      </div>
    </div>
    <div id="chkmodal" class="modal">
     <div class="modal-content">
      <a class="aclose" href="https://iggrowth-online.github.io/store/">
      <button class="btnClose">Done</button>
      </a>
       <p style="font-size: 28px;">Thank you for <br> your purchase</p>
       <p style="font-size: 20px;">We have received your <br>
         order and your followers <br>
         will be delivered shortly. </p>
       <p style="font-size: 20px;">If you have any <br>
         questions, reach out <br>
         to us at <br>
         info@IGgrowth.online</p>
     </div>
   </div>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAw318nxh-SgjFqn9Qxuo1ZGDHYQeXKHJcMSSLenQlWD1vnfyWspAkiTESmpaewfspaHDbkTR7Y38mCvY"></script>
    <script src="index.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
