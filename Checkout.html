<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>IGgrowth | Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/BannerMaker_28022023_2111111.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div style="position: absolute; background-color: #F3F6FD; width: 100%; height: 100%;"></div>
    <div class="center-row">
      <div id="checkout-box">
        <div style="position: absolute; display: flex; flex-direction: column; align-items: center;">
          <h3 id="text-amount">100 Instagram Followers</h3>
          <div id="dividing-line"></div>
          <input type="text" id="usernameInput" aria-label="Instagram username" autocomplete="username" placeholder="Instagram username">
          <input type="text" id="emailInput" aria-label="Email address" autocomplete="email" placeholder="Email address">
          <button id="submitBtn">Continue</button>
          <span id="errorText" role="alert"></span>
          <div id="loadingText" style="font-weight: bold;"></div>
          <div class="center-row">
          <a id="sd" href="Buy.html">
            <button id="select-different">Pick a different package</button>
          </a>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
